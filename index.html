    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quanto costa Easy Decision?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Durante l'Accesso Anticipato Gratuito tutte le funzionalità sono incluse a 0 CHF / 0 EUR: puoi creare proposte di voto, impostare scadenze, allegare contesto ed esportare i risultati in PDF e CSV."
          }
        },
        {
          "@type": "Question",
          "name": "Chi vota deve registrarsi o creare un account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No: chi riceve il link di una votazione può esprimere il proprio voto istantaneamente senza registrarsi e senza installare alcuna app. Solo chi crea e gestisce la dashboard accede con Google o link email."
          }
        },
        {
          "@type": "Question",
          "name": "Come vengono protetti i dati e la privacy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Easy Decision rispetta la Legge Federale sulla Protezione dei Dati (LPD) svizzera e il GDPR europeo. I dati sono archiviati su infrastruttura cloud protetta con controllo degli accessi e non vengono mai ceduti a terzi."
          }
        },
        {
          "@type": "Question",
          "name": "Quali modalità di voto sono disponibili?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puoi scegliere tra 4 modalità di voto: Sì / No per decisioni rapide, Scelta Singola, Scelta Multipla per raccogliere più preferenze e Valutazione a Stelle da 1 a 5."
          }
        }
      ]
    }
