[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/vote"
  to = "/.netlify/functions/vote"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/payrexx-webhook"
  to = "/.netlify/functions/payrexx-webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
